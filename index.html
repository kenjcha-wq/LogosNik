<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>LogosNik | 文学实验室 </title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@700&family=Noto+Sans+SC:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #f4f4f0; font-family: 'Noto Sans SC', sans-serif; height: 100dvh; width: 100vw; overflow: hidden; color: #333; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .notebook-case { background-color: #fdfdfb; box-shadow: 0 10px 40px rgba(0,0,0,0.08); border-radius: 8px; border: 1px solid #e5e5e0; }
        .notebook-paper { background-image: linear-gradient(#f1f1f1 1px, transparent 1px); background-size: 100% 2.5rem; line-height: 2.5rem; }
        .point-card { background: white; border: 1px solid #eee; border-radius: 12px; padding: 12px; margin-bottom: 12px; transition: all 0.2s; cursor: pointer; text-align: left; position: relative; }
        .point-card:hover { border-color: #000; transform: translateY(-2px); }
        .fragment-pill { flex-shrink: 0; background: white; border: 1px solid #e5e5e0; border-radius: 999px; padding: 3px 12px; font-size: 10px; font-weight: 700; color: #555; cursor: pointer; white-space: nowrap; transition: all 0.2s; }
        .fragment-pill:hover { border-color: #000; color: #000; }
        
        #desktop-source-drawer {
            position: fixed; right: 0; top: 0; bottom: 0; width: 350px;
            background: rgba(255,255,255,0.98); backdrop-filter: blur(15px);
            z-index: 150; transform: translateX(100%); transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: -15px 0 35px rgba(0,0,0,0.05); border-left: 1px solid #eee;
        }
        #desktop-source-drawer.active { transform: translateX(0); }

        #desktop-workshop-drawer {
            position: fixed; left: 0; top: 0; bottom: 0; width: 320px;
            background: rgba(255,255,255,0.98); backdrop-filter: blur(15px);
            z-index: 150; transform: translateX(-100%); transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 15px 0 35px rgba(0,0,0,0.05); border-right: 1px solid #eee;
        }
        #desktop-workshop-drawer.active { transform: translateX(0); }

        /* 修复屏幕溢出的关键约束 */
        .desktop-layout { 
            display: flex; flex-direction: column; height: 100dvh; width: 100vw; padding: 0.6rem; gap: 0.6rem; 
            max-width: 100%; max-height: 100%;
        }

        .mobile-btn-float {
            position: fixed; z-index: 200; width: 44px; height: 44px;
            background: #000; color: white; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2); font-size: 16px; transition: transform 0.2s;
        }
        .btn-chat { bottom: 30px; right: 20px; background: #000; }
        .btn-lib { bottom: 30px; right: 75px; background: #555; }
        .btn-analysis { bottom: 30px; left: 20px; background: #555; }

        @media (max-width: 768px) {
            .desktop-layout { display: none !important; }
            #desktop-workshop-drawer { display: none !important; }
            .mobile-layout { display: flex !important; flex-direction: column; height: 100dvh; width: 100%; background: #f4f4f0; overflow: hidden; }
            .mobile-side-panel { position: absolute; top: 0; bottom: 0; z-index: 300; width: 85%; background: #fdfdfb; transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 0 0 40px rgba(0,0,0,0.1); }
            #mobileLeftPanel { left: 0; transform: translateX(-100%); }
            #mobileLeftPanel.active { transform: translateX(0); }
            #mobileRightPanel { right: 0; transform: translateX(100%); }
            #mobileRightPanel.active { transform: translateX(0); }
            .mobile-notebook { flex: 1; padding: 4px 8px; overflow-y: auto; }
            .mobile-editor-paper { background-image: linear-gradient(#f1f1f1 1px, transparent 1px); background-size: 100% 2.1rem; line-height: 2.1rem; font-size: 16px; }
            .mobile-header { padding: 0 12px; height: 38px; border-bottom: 1px solid #eee; background: #f4f4f0; }
            #mobile-chat-modal { position: fixed; inset: 0; z-index: 500; background: #0a0a0a; display: none; flex-direction: column; }
            #mobile-chat-modal.active { display: flex; }
            #mobileChatHistory { flex: 1; overflow-y: auto !important; -webkit-overflow-scrolling: touch; }
        }
    </style>
</head>
<body>

<div id="desktop-source-drawer" class="flex flex-col text-left">
    <div class="p-4 border-b flex justify-between items-center bg-zinc-50">
        <h3 class="text-xs font-bold text-zinc-400 uppercase tracking-widest">知识库</h3>
        <div class="flex items-center gap-3">
            <label class="cursor-pointer text-[9px] px-2.5 py-1 bg-zinc-800 text-white rounded-full font-bold hover:bg-black">+ 上传文章<input type="file" class="hidden" onchange="handleFileUpload(event)"></label>
            <button onclick="toggleDesktopReference()" class="text-zinc-400 hover:text-black text-xs">关闭</button>
        </div>
    </div>
    <div id="knowledge-mount-status" class="px-4 py-2 border-b bg-amber-50/60 text-[10px] text-zinc-500 flex justify-between items-center shrink-0"></div>
    <div class="px-4 py-2 border-b shrink-0"><input id="knowledge-search" oninput="renderKnowledge()" class="w-full p-2 border rounded-xl text-xs outline-none bg-zinc-50" placeholder="搜索知识库文章（标题或内容）..."></div>
    <div id="knowledge-panel" class="flex-1 overflow-y-auto p-4 no-scrollbar"></div>
</div>

<div id="desktopLayout" class="desktop-layout">
    <header class="h-8 flex shrink-0 justify-between items-center px-2">
        <div class="flex items-center gap-4 text-left">
            <div class="flex flex-col cursor-pointer" onclick="goHome()">
                <span class="text-base font-bold tracking-widest font-serif uppercase text-zinc-800">LogosNik</span>
                <span class="text-[8px] font-bold text-zinc-400 -mt-1 uppercase">文学实验室 </span>
            </div>
        </div>
        <div class="flex items-center gap-3">
            <span class="text-[8px] font-mono text-zinc-400 mr-2 border-r pr-3 border-zinc-200">36°03'N 103°48'E | <span id="timestamp"></span></span>
            <button onclick="createNewNote()" class="px-3 py-1 bg-zinc-800 text-white rounded-full text-[9px] font-bold hover:bg-black transition-all">+ 新建</button>
            <button onclick="runAutoWorkshop()" class="px-4 py-1 bg-blue-600 text-white rounded-full text-[9px] font-bold shadow-md hover:bg-blue-700">人格合议</button>
            <button onclick="toggleDesktopWorkshop()" class="px-3 py-1 bg-zinc-200 rounded-full text-[9px] font-bold hover:bg-zinc-300 transition-all">📑 合议评审</button>
            <label class="cursor-pointer text-[9px] px-3 py-1 bg-zinc-200 rounded-full font-bold hover:bg-zinc-300">上传文章<input type="file" class="hidden" onchange="handleFileUpload(event)"></label>
            <button onclick="exportMarkdown()" class="text-[9px] px-3 py-1 bg-green-600 text-white rounded-full font-bold uppercase">Export</button>
            <button onclick="openSettings()" class="p-1 text-zinc-400">⚙️</button>
        </div>
    </header>

    <div class="flex-1 flex gap-4 overflow-hidden w-full">
        <main class="flex-1 flex flex-col gap-2 overflow-hidden text-left min-w-0">
            <div class="notebook-case flex-1 flex flex-col overflow-hidden relative">
                <div class="p-4 border-b bg-white/50 flex shrink-0 items-center justify-between h-12">
                    <input type="text" id="note-title" oninput="saveCurrentNote()" placeholder="拟演课题..." class="text-lg font-bold bg-transparent outline-none font-serif w-full">
                    <span id="save-indicator" class="text-[8px] text-green-500 font-bold opacity-0 transition-opacity uppercase">Synced</span>
                </div>
                <div class="flex-1 overflow-y-auto notebook-paper p-10 no-scrollbar">
                    <textarea id="note-editor" oninput="saveCurrentNote()" class="w-full h-full bg-transparent border-none outline-none text-zinc-700 resize-none text-[17px] leading-[2.5rem]" placeholder="在此捕捉存在真相..."></textarea>
                </div>
            </div>
            <div class="h-20 shrink-0 bg-white/60 backdrop-blur rounded-lg border p-2 flex flex-col">
                <div class="flex justify-between items-center px-1 mb-1">
                    <span class="text-[9px] font-bold text-zinc-400 uppercase">随手记 / Quick Notes</span>
                    <div class="flex gap-3">
                        <button onclick="openQuickHistory()" class="text-[9px] text-zinc-500 font-bold hover:text-black">历史</button>
                        <button onclick="openInspiration()" class="text-[9px] text-amber-600 font-bold hover:text-amber-700">灵感库</button>
                        <button onclick="addFragment()" class="text-[9px] text-blue-600 font-bold">+ 记录</button>
                    </div>
                </div>
                <div id="fragment-container" class="flex-1 flex gap-2.5 overflow-x-auto no-scrollbar items-center px-1"></div>
            </div>
        </main>

        <aside class="w-96 flex-shrink-0 flex flex-col gap-3 overflow-hidden text-left">
            <div class="flex-1 bg-zinc-900 rounded-3xl p-5 text-white flex flex-col shadow-xl overflow-hidden relative border border-white/5">
                <div class="flex shrink-0 justify-between items-center mb-3">
                    <span class="text-[9px] font-bold text-zinc-500 uppercase tracking-widest flex items-center gap-1">Nik Assistant</span>
                    <div class="flex items-center gap-2">
                        <button onclick="toggleDesktopReference()" class="text-[9px] font-bold px-2.5 py-1 rounded-full bg-white/10 text-zinc-300 hover:text-white hover:bg-white/20 transition-all">📚 知识库</button>
                        <select id="chat-personality" class="bg-zinc-800 text-[8px] font-bold text-blue-400 px-1 py-0.5 rounded outline-none border-none cursor-pointer" onchange="updateChatPlaceholder()"></select>
                    </div>
                </div>
                <div id="chat-history" class="flex-1 overflow-y-auto text-[11px] mb-3 space-y-4 no-scrollbar opacity-80 font-light pr-1"></div>
                <div class="relative shrink-0 pt-3 border-t border-white/10">
                    <textarea id="chat-input" rows="1" onkeypress="if(event.key==='Enter' && !event.shiftKey) { event.preventDefault(); askNik(); }" class="w-full bg-white/5 rounded-lg p-2 text-[11px] outline-none transition-all resize-none" placeholder="输入指令..."></textarea>
                </div>
            </div>
        </aside>
    </div>
</div>

<div id="desktop-workshop-drawer" class="flex flex-col text-left">
    <div class="p-4 border-b flex justify-between items-center bg-zinc-50">
        <h3 class="text-xs font-bold text-zinc-400 uppercase tracking-widest">合议筛选与评审</h3>
        <div class="flex items-center gap-3">
            <button onclick="openHistory()" class="text-[9px] font-bold text-blue-500 uppercase">档案库</button>
            <button onclick="toggleDesktopWorkshop()" class="text-zinc-400 hover:text-black text-xs">关闭</button>
        </div>
    </div>
    <div id="workshop-toggles" class="grid grid-cols-2 gap-1 p-4 pb-2 border-b border-zinc-100"></div>
    <div id="points-list" class="flex-1 overflow-y-auto p-4 no-scrollbar"></div>
</div>

<!-- ==================== 手机端 ==================== -->
<div id="mobileLayout" class="mobile-layout" style="display: none;">
    <div class="mobile-header flex justify-between items-center">
        <div class="flex flex-col leading-none text-left">
            <span class="font-serif font-bold text-sm tracking-tight text-zinc-800">LogosNik</span>
            <span class="text-[7px] font-mono text-zinc-400 uppercase mt-0.5"><span class="mobile-time"></span> | 36°03'N 103°48'E</span>
        </div>
       <div class="flex gap-1.5">
        <button onclick="openQuickHistory()" class="px-2 py-1 bg-zinc-100 rounded-full text-[9px] font-bold">🕘 随手记</button>
        <button onclick="openInspiration()" class="px-2 py-1 bg-amber-200/70 rounded-full text-[9px] font-bold text-amber-900">💡 灵感库</button>
        <button onclick="createNewNote()" class="px-2 py-1 bg-zinc-100 rounded-full text-[9px] font-bold">新建</button>
        <button onclick="runAutoWorkshop()" class="px-3 py-1 bg-blue-600 text-white rounded-full text-[9px] font-bold">合议</button>
        <button onclick="openSettings()" class="p-1 text-zinc-500">⚙️</button>
    </div>
 </div>
    <div class="mobile-notebook">
        <div class="notebook-case h-full flex flex-col overflow-hidden">
            <div class="p-3 border-b bg-white/80 flex justify-between items-center h-10">
                <input type="text" id="mobileNoteTitle" oninput="saveCurrentNoteMobile()" placeholder="无标题" class="w-full font-bold bg-transparent outline-none text-sm">
            </div>
            <div id="mobileFragmentContainer" class="h-9 bg-white/60 border-b flex gap-2 items-center px-3 overflow-x-auto no-scrollbar flex-shrink-0"></div>
            <div class="flex-1 overflow-y-auto p-4 mobile-editor-paper no-scrollbar bg-[#fdfdfb]">
                <textarea id="mobileNoteEditor" oninput="saveCurrentNoteMobile()" class="w-full h-full bg-transparent border-none outline-none text-zinc-700 resize-none min-h-[400px]" placeholder="开始记录..."></textarea>
            </div>
        </div>
    </div>
    <div class="mobile-btn-float btn-analysis" onclick="toggleLeftPanel()" title="合议评审">📑</div>
    <div class="mobile-btn-float btn-analysis" style="bottom: 106px;" onclick="openHistory()" title="底稿档案">🗂</div>
    <div class="mobile-btn-float btn-lib" onclick="toggleRightPanel()">📚</div>
    <div class="mobile-btn-float btn-chat" onclick="openMobileChat()">Nik</div>

    <div id="mobileLeftPanel" class="mobile-side-panel flex flex-col text-left">
        <div class="p-3 border-b flex justify-between items-center bg-zinc-50">
            <span class="font-bold text-[10px] uppercase font-serif">合议筛选与评审</span>
            <button onclick="toggleLeftPanel()" class="text-zinc-400 text-xs">关闭</button>
        </div>
        <div id="mobile-workshop-toggles" class="p-3 grid grid-cols-2 gap-2 border-b bg-zinc-50/50"></div>
        <div id="mobilePointsList" class="flex-1 overflow-y-auto p-4"></div>
    </div>
    <div id="mobileRightPanel" class="mobile-side-panel flex flex-col text-left">
        <div class="p-3 border-b flex justify-between items-center bg-zinc-50">
            <span class="font-bold text-[10px] uppercase font-serif">知识库</span>
            <div class="flex items-center gap-2">
                <label class="cursor-pointer text-[9px] px-2 py-1 bg-zinc-800 text-white rounded-full font-bold">+ 上传<input type="file" class="hidden" onchange="handleFileUpload(event)"></label>
                <button onclick="toggleRightPanel()" class="text-zinc-400 text-xs">关闭</button>
            </div>
        </div>
        <div id="mobileKnowledgeMount" class="px-3 py-2 border-b bg-amber-50/60 text-[10px] text-zinc-500 shrink-0"></div>
        <div class="px-3 py-2 border-b shrink-0"><input id="mobileKnowledgeSearch" oninput="renderKnowledge()" class="w-full p-2 border rounded-xl text-xs outline-none bg-zinc-50" placeholder="搜索知识库文章..."></div>
        <div id="mobileKnowledgePanel" class="flex-1 overflow-y-auto p-3"></div>
    </div>
</div>

<div id="mobile-chat-modal" class="flex-col">
    <div class="p-4 border-b border-white/10 flex justify-between items-center text-white">
        <div class="flex items-center gap-2">
            <span class="font-serif font-bold text-lg">Assistant</span>
            <select id="mobile-chat-personality" class="bg-zinc-800 text-[9px] font-bold text-blue-400 px-2 py-1 rounded border-none outline-none" onchange="updateChatPlaceholder()"></select>
        </div>
        <button onclick="closeMobileChat()" class="text-zinc-400">关闭</button>
    </div>
    <div id="mobileChatHistory" class="p-4 space-y-6"></div>
    <div class="p-4 border-t border-white/10 flex gap-2 items-end bg-black">
        <textarea id="mobileChatInput" rows="2" class="flex-1 bg-white/5 rounded-xl p-3 text-sm text-white outline-none resize-none" placeholder="输入指令..."></textarea>
        <button onclick="askNikMobile()" class="bg-blue-600 rounded-xl px-5 py-3 font-bold text-sm text-white">发送</button>
    </div>
</div>

<script>
    // --- 核心配置：全局模型接入（仅两席：云端 API + 本地模型），人格只靠提示词区分 ---
    const DEFAULT_MODELS = { cloud: { host: 'https://api.siliconflow.cn/v1', model: 'deepseek-ai/DeepSeek-V3', key: '' }, local: { host: 'http://localhost:11434/v1', model: 'gemma2', key: 'ollama' } };
    const DEFAULT_PERSONAS = {
        ch1: { label: '文学', mode: 'cloud', enabled: true, temp: 0.9, prompt: '跳跃灵感人格：以村上春树式的冷峻文风进行评审或创作。' },
        ch2: { label: '引擎', mode: 'cloud', enabled: true, temp: 0.3, prompt: '稳健执行人格：核心在于事实核查与逻辑严密。修正文字校对错误。' },
        ch3: { label: '哲学', mode: 'cloud', enabled: true, temp: 0.9, prompt: '跳跃灵感人格：萨特存在主义视角。审计内容中的“自欺”逻辑。' },
        ch4: { label: '公文', mode: 'local', enabled: false, temp: 0.2, prompt: '稳健执行人格：中国党政机关公文风格。严谨、客观、符合行政规范。' },
        ch5: { label: '自定义A', mode: 'cloud', enabled: false, temp: 0.7, prompt: '（自定义人格：请在设置中编写此人格的角色设定与文风要求。）' },
        ch6: { label: '自定义B', mode: 'cloud', enabled: false, temp: 0.7, prompt: '（自定义人格：请在设置中编写此人格的角色设定与文风要求。）' }
    };
    const INSP_TAGS = ['人物', '情节', '金句', '设定', '其他'];
    function deepClone(o) { return JSON.parse(JSON.stringify(o)); }
    function loadConfigs() {
        const oldV6 = JSON.parse(localStorage.getItem('ln_multi_config_v6') || 'null');
        let models = JSON.parse(localStorage.getItem('ln_models_v1') || 'null');
        let personas = JSON.parse(localStorage.getItem('ln_personas_v1') || 'null');
        if (!personas && oldV6) {
            // 从旧版"每人格独立模型"迁移：全局模型取首个非空配置，人格保留标签/提示词/倾向
            models = deepClone(DEFAULT_MODELS);
            const fc = Object.values(oldV6).find(p => p.cloud && p.cloud.host); if (fc) models.cloud = { ...fc.cloud };
            const fl = Object.values(oldV6).find(p => p.local && p.local.host); if (fl) models.local = { ...fl.local };
            personas = {};
            Object.entries(oldV6).forEach(([id, p]) => { personas[id] = { label: p.label, mode: p.mode || 'cloud', enabled: !!p.enabled, temp: p.temp || 0.7, prompt: p.prompt || '' }; });
            personas.ch5 = deepClone(DEFAULT_PERSONAS.ch5);
            personas.ch6 = deepClone(DEFAULT_PERSONAS.ch6);
            localStorage.setItem('ln_models_v1', JSON.stringify(models));
            localStorage.setItem('ln_personas_v1', JSON.stringify(personas));
        }
        modelConfig = models || deepClone(DEFAULT_MODELS);
        multiConfig = personas || deepClone(DEFAULT_PERSONAS);
        if (!multiConfig.ch5) multiConfig.ch5 = deepClone(DEFAULT_PERSONAS.ch5);
        if (!multiConfig.ch6) multiConfig.ch6 = deepClone(DEFAULT_PERSONAS.ch6);
    }
    let modelConfig = null;   // { cloud: {host, model, key}, local: {host, model, key} }
    let multiConfig = null;   // { ch1..ch6: {label, mode, enabled, temp, prompt} }

    let globalConfig = JSON.parse(localStorage.getItem('ln_global_config')) || { userName: 'Researcher' };
    let warehouse = JSON.parse(localStorage.getItem('ln_warehouse_v16')) || [];
    let currentId = localStorage.getItem('ln_current_id') || null;
    let chatMemories = JSON.parse(localStorage.getItem('ln_chat_memories_v3')) || {};
    let quickNotes = JSON.parse(localStorage.getItem('ln_quicknotes_v1') || 'null');
    let inspirations = JSON.parse(localStorage.getItem('ln_inspirations_v1') || '[]');
    let inspTagFilter = '全部';
    let knowledge = JSON.parse(localStorage.getItem('ln_knowledge_v1') || '[]');
    let knowledgeViewId = null;

    function escHtml(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }
    function fmtTime(ts) { const d = new Date(ts || Date.now()); const p = n => String(n).padStart(2, '0'); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; }

    async function universalApiCall(text, configObj, isChat = false, systemOverwrite = null) {
        const active = configObj.mode === 'cloud' ? modelConfig.cloud : modelConfig.local;
        if (!active.key || !active.host) return `${configObj.label}未配置（请到设置中完成模型接入）`;
        const currentItem = warehouse.find(i => i.id == currentId);
        let systemPrompt = systemOverwrite || configObj.prompt;
        if (currentItem && currentItem.textbook && currentItem.textbook.length > 5) {
            systemPrompt += `\n\n【参考背景学习资料】：\n${currentItem.textbook.substring(0, 3000)}`;
        }
        let messages = [{ role: "system", content: systemPrompt }];
        if (isChat && currentId) {
            messages = messages.concat((chatMemories[currentId] || []).slice(-10));
        }
        messages.push({ role: "user", content: text });
        try {
            const response = await fetch(`${active.host.replace(/\/$/, '')}/chat/completions`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${active.key.trim()}` },
                body: JSON.stringify({ model: active.model, messages, stream: false, temperature: configObj.temp || 0.7 })
            });
            const data = await response.json();
            return data.choices?.[0]?.message?.content || "模型无响应";
        } catch (e) { return `${configObj.label}通信中断`; }
    }

    function appendThinking(containerId, text = "正在深度拟演中...") {
        const h = document.getElementById(containerId); if(!h) return;
        const d = document.createElement('div'); d.id = 'thinking-bubble';
        d.className = "p-3 bg-white/5 rounded-xl border border-blue-500/20 mb-4 animate-pulse";
        d.innerHTML = `<span class="font-bold opacity-30 uppercase text-[8px] block mb-1 text-blue-400">LogosNik</span><div class="text-[11px] text-zinc-500 italic">${text}</div>`;
        h.appendChild(d); h.scrollTop = h.scrollHeight;
    }
    function removeThinking() { const b = document.getElementById('thinking-bubble'); if(b) b.remove(); }

    async function askNik() {
        const i = document.getElementById('chat-input'); const p = document.getElementById('chat-personality').value;
        const v = i.value.trim(); if(!v) return;
        appendChat('Me', v, 'chat-history'); i.value = '';
        appendThinking('chat-history');
        const res = await universalApiCall(v, multiConfig[p], true);

    async function runAutoWorkshop() {

        const ptsDiv = document.getElementById(window.innerWidth<=768 ? 'mobilePointsList' : 'points-list');

        const activeIds = Object.keys(multiConfig).filter(id => multiConfig[id].enabled);
        const results = await Promise.all(activeIds.map(id => universalApiCall(ed.value, multiConfig[id])));
        
        const itm = warehouse.find(i => i.id == currentId);

    async function deepRevise(btn, personaId) {
        const suggestion = btn.parentElement.parentElement.querySelector('.analysis-text').innerText;
        const ed = document.getElementById(window.innerWidth<=768 ? 'mobileNoteEditor' : 'note-editor');
        const originalText = ed.value;
        if(!originalText.trim()) return;
        const config = multiConfig[personaId];
        btn.innerText = "修订中..."; btn.disabled = true; btn.classList.add('animate-pulse');
        const revisionPrompt = `你现在是一名顶尖编辑。请根据建议深度修改原稿。吸收建议核心精神，对正文进行重构润色。直接输出修改后的全文内容，不要包含前缀解释。\n\n【建议】：${suggestion}`;
        const revisedText = await universalApiCall(originalText, config, false, revisionPrompt);
        if(revisedText && revisedText.length > 10 && !revisedText.includes("通信中断")) {
            if(confirm("AI 修订完成，应用到正文？")) { ed.value = revisedText; saveCurrentNote(); if(window.innerWidth<=768) toggleLeftPanel(); }
        } else { alert("修订失败：" + revisedText); }
        btn.innerText = "深度修订"; btn.disabled = false; btn.classList.remove('animate-pulse');
    }

    function renderKnowledge() {
        const itm = warehouse.find(i => i.id == currentId);
        const mounted = itm && itm.textbook ? knowledge.find(k => k.content === itm.textbook) : null;
        const statusHtml = mounted
            ? `<span>当前稿件参考资料：<b>${escHtml(mounted.title)}</b></span><button onclick="unmountKnowledge()" class="text-[9px] bg-white px-2 py-1 rounded font-bold text-zinc-500 border shrink-0">卸载</button>`
            : `<span class="text-zinc-400">当前稿件未挂载参考资料（挂载后 AI 合议/对话会参考该文章）</span>`;
        const s1 = document.getElementById('knowledge-mount-status'); if (s1) s1.innerHTML = statusHtml;
        const s2 = document.getElementById('mobileKnowledgeMount'); if (s2) s2.innerHTML = statusHtml;

        let bodyHtml;
        const k = knowledge.find(x => x.id === knowledgeViewId);
        if (k) {
            bodyHtml = `
            <div class="flex items-center justify-between mb-3">
                <button onclick="backToKnowledgeList()" class="text-[10px] font-bold text-blue-600">← 返回列表</button>
                <div class="flex gap-2">

            <div class="text-sm leading-relaxed text-zinc-600 font-serif whitespace-pre-wrap">${escHtml(k.content)}</div>`;
        } else {
            const stripHtml = (s) => String(s || '').replace(/<[^>]+>/g, ' ').replace(/&nbsp;/g, ' ').replace(/\s+/g, ' ').trim();
            const kwInput = document.getElementById('knowledge-search');
            const kwMInput = document.getElementById('mobileKnowledgeSearch');
            const kw = ((kwInput && window.innerWidth > 768 ? kwInput.value : (kwMInput ? kwMInput.value : '')) || '').trim();

                    </div>
                </div>
            </div>`).join('') : '<div class="p-6 text-center text-[10px] text-zinc-300 uppercase tracking-widest">暂无随手记</div>';
    }
    function insertQuickNote(id) { const n = quickNotes.find(x => x.id === id); if (n) adoptFragment(n.content); }
    function deleteQuickNote(id) {
        quickNotes = quickNotes.filter(x => x.id !== id);
        localStorage.setItem('ln_quicknotes_v1', JSON.stringify(quickNotes));
        renderQuickHistory(); renderFragments();
    }
    function transferToInspiration(id) {
        const n = quickNotes.find(x => x.id === id); if (!n) return;
        inspirations.unshift({ id: Date.now(), content: n.content, tag: '其他', ts: Date.now() });
        quickNotes = quickNotes.filter(x => x.id !== id);
        localStorage.setItem('ln_inspirations_v1', JSON.stringify(inspirations));
        localStorage.setItem('ln_quicknotes_v1', JSON.stringify(quickNotes));
        renderQuickHistory(); renderFragments();
    }

    // --- 灵感库 ---
    function openInspiration() { renderInspirations(); document.getElementById('inspiration-modal').classList.remove('hidden'); }
    function closeInspiration() { document.getElementById('inspiration-modal').classList.add('hidden'); }
    function setInspTagFilter(t) { inspTagFilter = t; renderInspirations(); }
    function addInspiration() {
        const i = document.getElementById('inspiration-input'); const t = document.getElementById('inspiration-tag').value;
        if (!i.value.trim()) return;
        inspirations.unshift({ id: Date.now(), content: i.value.trim(), tag: t, ts: Date.now() });
        localStorage.setItem('ln_inspirations_v1', JSON.stringify(inspirations));
        i.value = ''; renderInspirations();
    }
    function updateInspTag(id, tag) { const it = inspirations.find(x => x.id === id); if (it) { it.tag = tag; localStorage.setItem('ln_inspirations_v1', JSON.stringify(inspirations)); } }
    function insertInspiration(id) { const it = inspirations.find(x => x.id === id); if (it) adoptFragment(it.content); }
    function deleteInspiration(id) { inspirations = inspirations.filter(x => x.id !== id); localStorage.setItem('ln_inspirations_v1', JSON.stringify(inspirations)); renderInspirations(); }
    function renderInspirations() {
        const kw = (document.getElementById('inspiration-search').value || '').trim();
        const chips = ['全部'].concat(INSP_TAGS).map(t => `<button onclick="setInspTagFilter('${t}')" class="px-2 py-0.5 rounded-full text-[9px] font-bold ${inspTagFilter === t ? 'bg-black text-white' : 'bg-zinc-100 text-zinc-500'}">${t}</button>`).join('');
        document.getElementById('inspiration-tags').innerHTML = chips;
        const list = inspirations.filter(x => (!kw || (x.content || '').includes(kw)) && (inspTagFilter === '全部' || x.tag === inspTagFilter));
        const l = document.getElementById('inspiration-list');
        l.innerHTML = list.length ? list.map(x => `
            <div class="p-3 bg-amber-50/60 rounded-xl border border-amber-100 text-left">
                <div class="text-[11px] text-zinc-700 leading-relaxed font-serif whitespace-pre-wrap">${escHtml(x.content)}</div>
                <div class="mt-2 flex items-center justify-between">
                    <div class="flex items-center gap-2">
                        <select onchange="updateInspTag(${x.id}, this.value)" class="text-[9px] bg-white border rounded px-1 py-0.5 outline-none">${INSP_TAGS.map(t => `<option ${x.tag === t ? 'selected' : ''}>${t}</option>`).join('')}</select>
                        <span class="text-[8px] text-zinc-400 font-mono">${fmtTime(x.ts || x.id)}</span>
                    </div>
                    <div class="flex gap-1.5">
                        <button onclick="insertInspiration(${x.id})" class="text-[8px] bg-zinc-100 px-2 py-1 rounded font-bold text-zinc-600">插入</button>
                        <button onclick="deleteInspiration(${x.id})" class="text-[8px] bg-red-50 text-red-500 px-2 py-1 rounded font-bold">删除</button>
                    </div>
                </div>
            </div>`).join('') : '<div class="p-6 text-center text-[10px] text-zinc-300 uppercase tracking-widest">灵感库暂空</div>';
    }

    // --- 备份与还原（全量仓库） ---
    function exportLabBackup() {
        const data = { version: 8, warehouse, quickNotes, inspirations, knowledge, modelConfig, multiConfig, globalConfig, chatMemories };
        const b = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const a = document.createElement('a'); a.href = URL.createObjectURL(b);
        a.download = `logosnik-backup-${new Date().toISOString().slice(0, 10)}.json`; a.click();
    }
    function importLabBackup(ev) {
        const f = ev.target.files[0]; if (!f) return; const r = new FileReader();
        r.onload = (e) => {
            try {
                const d = JSON.parse(e.target.result);
                if (!d.warehouse) { alert('备份文件格式不正确'); return; }
                if (d.modelConfig) localStorage.setItem('ln_models_v1', JSON.stringify(d.modelConfig));
                if (d.multiConfig) localStorage.setItem('ln_personas_v1', JSON.stringify(d.multiConfig));
                if (d.quickNotes) localStorage.setItem('ln_quicknotes_v1', JSON.stringify(d.quickNotes));
                if (d.inspirations) localStorage.setItem('ln_inspirations_v1', JSON.stringify(d.inspirations));
                if (d.knowledge) localStorage.setItem('ln_knowledge_v1', JSON.stringify(d.knowledge));
                if (d.chatMemories) localStorage.setItem('ln_chat_memories_v3', JSON.stringify(d.chatMemories));
                if (d.globalConfig) localStorage.setItem('ln_global_config', JSON.stringify(d.globalConfig));
                localStorage.setItem('ln_warehouse_v16', JSON.stringify(d.warehouse));
                location.reload();
            } catch (err) { alert('还原失败：' + err.message); }
        };
        r.readAsText(f); ev.target.value = '';
    }

    function populatePersonaSelects() {
        const html = Object.keys(multiConfig).map(id => {
            const p = multiConfig[id];
            return `<option value="${id}">${escHtml(p.label)} [${p.temp >= 0.6 ? '跳跃' : '稳健'}]</option>`;
        }).join('');
        const d = document.getElementById('chat-personality'); if (d) d.innerHTML = html;
        const m = document.getElementById('mobile-chat-personality'); if (m) m.innerHTML = html;
    }

    // --- 核心改进：加固加载逻辑，防止数据丢失 ---
    function init() {
        loadConfigs();
        warehouse = JSON.parse(localStorage.getItem('ln_warehouse_v16')) || [];
        if(!warehouse.length) {
            warehouse = [{ id: 1, title: '初始底稿', noteTitle: '新稿件', note: '', textbook: '参考资料待上传...', fragments: [], workshopHistory: [] }];
            saveToLocalStorage();
        }
        if (!quickNotes) {
            // 首次升级：把散落在各稿件下的旧"灵感碎片"汇聚为全局随手记
            quickNotes = [];
            warehouse.forEach(itm => (itm.fragments || []).forEach(f => quickNotes.push({ id: f.id || Date.now(), content: f.content })));
            quickNotes.sort((a, b) => b.id - a.id);
            localStorage.setItem('ln_quicknotes_v1', JSON.stringify(quickNotes));
        }
        if (localStorage.getItem('ln_knowledge_v1') === null) {
            // 首次升级：把旧稿件挂过的参考资料收进全局知识库
            const PLACEHOLDERS = ['资料待上传...', '参考资料待上传...'];
            warehouse.forEach((itm, idx) => {
                const tb = (itm.textbook || '').trim();
                if (tb.length > 20 && !PLACEHOLDERS.includes(tb) && !knowledge.some(k => k.content === itm.textbook)) {
                    knowledge.push({ id: Date.now() + idx * 1000 + 1, title: itm.noteTitle || itm.title || '未命名文章', content: itm.textbook });
                }
            });
            saveKnowledge();
        }
        currentId = localStorage.getItem('ln_current_id');
        const itmExist = warehouse.find(i => i.id == currentId);
        if(!currentId || !itmExist) {
            currentId = warehouse[0].id;
        }
        loadFromWarehouse(currentId);
        setInterval(updateTime, 1000); updateTime(); populatePersonaSelects(); updateChatPlaceholder();
        renderWorkshopControls(); renderFragments(); checkScreenSize(); window.addEventListener('resize', checkScreenSize);
    }
    window.onload = init;
</script>

<!-- 配置中心 -->
<div id="settings-modal" class="fixed inset-0 z-[200] bg-black/40 backdrop-blur flex items-center justify-center hidden" onclick="if(event.target===this) closeSettings()">
    <div class="bg-white rounded-3xl max-w-xl w-full p-6 m-4 shadow-2xl overflow-y-auto max-h-[90vh]">
        <h3 class="font-bold mb-1 font-serif text-lg text-left">模型接入与人格配置</h3>
        <p class="text-[9px] text-zinc-400 mb-4 text-left">模型全局只需配置一次；六席人格共用模型，仅靠提示词区分。</p>
        <div id="models-configs-container"></div>
        <div class="text-[9px] font-bold text-zinc-400 uppercase tracking-widest mb-2">人格设定（含两席自定义）</div>
        <div id="multi-configs-container"></div>
        <div class="mt-4 pt-4 border-t text-left">
            <div class="grid grid-cols-2 gap-3 mb-4">
                <button onclick="exportLabBackup()" class="py-3 bg-zinc-100 rounded-xl text-[10px] font-bold hover:bg-zinc-200">备份全量仓库</button>
                <label class="py-3 bg-zinc-100 rounded-xl text-[10px] font-bold text-center cursor-pointer hover:bg-zinc-200">还原全量仓库<input type="file" class="hidden" onchange="importLabBackup(event)"></label>
            </div>
            <label class="text-[10px] font-bold text-zinc-400 uppercase tracking-widest">主编署名</label>
            <input id="set-user-name" class="w-full p-2 border rounded-xl mt-1 outline-none text-sm font-bold bg-zinc-50" placeholder="Researcher">
            <button onclick="saveMultiSettings()" class="w-full mt-4 py-3 bg-black text-white rounded-2xl font-bold shadow-xl">同步配置并重载</button>
            <p class="text-[8px] text-zinc-400 mt-2 text-center">保存后自动重载；随手记、灵感库与稿件数据均保留。</p>
        </div>
    </div>
</div>

<div id="history-modal" class="fixed inset-0 z-[200] bg-black/40 backdrop-blur flex items-center justify-center hidden" onclick="if(event.target===this) closeHistory()">
    <div class="bg-white rounded-3xl max-w-sm w-full p-6 m-4 shadow-2xl text-left">
        <h3 class="font-bold mb-3 font-serif text-lg border-b pb-2 tracking-widest">底稿档案中心</h3>
        <input id="history-search" oninput="renderHistory()" class="w-full p-2 border rounded-xl text-xs outline-none mb-3 bg-zinc-50" placeholder="搜索稿件（标题或正文）...">
        <div id="warehouse-list" class="max-h-96 overflow-y-auto no-scrollbar"></div>
    </div>
</div>

<div id="fragment-modal" class="fixed inset-0 z-[300] bg-black/40 backdrop-blur flex items-center justify-center hidden" onclick="if(event.target===this) closeFragmentModal()">
    <div class="bg-white rounded-2xl max-w-sm w-full p-5 m-4 shadow-2xl text-left">
        <h4 class="font-bold text-sm mb-3">随手记一条</h4>
        <textarea id="fragment-input" class="w-full h-32 p-3 border rounded-xl text-sm outline-none resize-none"></textarea>
        <button onclick="saveFragment()" class="w-full mt-4 py-3 bg-black text-white rounded-xl font-bold">存档</button>
    </div>
</div>

<div id="quicknotes-modal" class="fixed inset-0 z-[300] bg-black/40 backdrop-blur flex items-center justify-center hidden" onclick="if(event.target===this) closeQuickHistory()">
    <div class="bg-white rounded-2xl max-w-md w-full p-5 m-4 shadow-2xl text-left flex flex-col max-h-[85vh]">
        <div class="flex justify-between items-center mb-3">
            <h4 class="font-bold text-sm">随手记 · 历史记录</h4>
            <div class="flex gap-3">
                <button onclick="closeQuickHistory(); addFragment();" class="text-[10px] bg-black text-white px-3 py-1.5 rounded-full font-bold">+ 记一笔</button>
                <button onclick="closeQuickHistory()" class="text-zinc-400 text-xs">关闭</button>
            </div>
        </div>
        <input id="quicknotes-search" oninput="renderQuickHistory()" class="w-full p-2 border rounded-xl text-xs outline-none mb-3 bg-zinc-50" placeholder="搜索随手记...">
        <div id="quicknotes-list" class="flex-1 overflow-y-auto no-scrollbar space-y-2"></div>
    </div>
</div>

<div id="inspiration-modal" class="fixed inset-0 z-[300] bg-black/40 backdrop-blur flex items-center justify-center hidden" onclick="if(event.target===this) closeInspiration()">
    <div class="bg-white rounded-2xl max-w-md w-full p-5 m-4 shadow-2xl text-left flex flex-col max-h-[85vh]">
        <div class="flex justify-between items-center mb-3">
            <h4 class="font-bold text-sm">灵感库</h4>
            <button onclick="closeInspiration()" class="text-zinc-400 text-xs">关闭</button>
        </div>
        <div class="flex gap-2 mb-2">
            <textarea id="inspiration-input" class="flex-1 p-2 border rounded-xl text-xs outline-none resize-none h-10 bg-zinc-50" placeholder="直接添加灵感..."></textarea>
            <select id="inspiration-tag" class="text-[10px] border rounded-xl px-1 bg-zinc-50 outline-none">
                <option>人物</option><option>情节</option><option>金句</option><option>设定</option><option>其他</option>
            </select>
            <button onclick="addInspiration()" class="bg-black text-white rounded-xl px-3 text-[10px] font-bold">添加</button>
        </div>
        <div id="inspiration-tags" class="flex gap-1.5 mb-2 flex-wrap"></div>
        <input id="inspiration-search" oninput="renderInspirations()" class="w-full p-2 border rounded-xl text-xs outline-none mb-3 bg-zinc-50" placeholder="搜索灵感...">
        <div id="inspiration-list" class="flex-1 overflow-y-auto no-scrollbar space-y-2"></div>
    </div>
</div>

</body>
